<style>
:root{
  --navy:#0d3b8e;--navy-hi:#1149ad;--navy-deep:#071f4d;--navy-soft:#e8efff;
  --green:#16924a;--green-hi:#1aa956;--green-soft:#e4f5ea;
  --sun:#f4b400;--sun-soft:#fff5d6;--sun-ink:#8a5a00;
  --ink:#0f1b33;--ink-2:#36405a;--ink-3:#525d78;
  --paper:#fff;--tint:#f2f6fc;--tint-2:#f8fafd;--line:#d9e1ee;--line-2:#e9eef6;
  --red:#b42318;--red-soft:#fdecea;--sky:#0369a1;--sky-soft:#e5f3fb;
  --violet:#6d3fc0;--violet-soft:#f0e9fb;--teal:#0f766e;--teal-soft:#e0f4f1;
  --lilac:#7c6cf0;--lilac-soft:#eeeafe;--blush-soft:#ffeef1;--on-brand:#fff;
  --btn-navy:#0d3b8e;--btn-navy-hi:#1149ad;--btn-green:#11793b;--btn-green-hi:#0e6a33;
  --shadow:0 1px 2px rgb(7 31 77/.06),0 12px 32px -16px rgb(7 31 77/.25);
  --shadow-lg:0 2px 4px rgb(7 31 77/.06),0 24px 60px -24px rgb(7 31 77/.35);
  --font-plex:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Outfit",var(--font-plex);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-plex);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%;height:auto}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.022em;line-height:1.15;margin:0}
a{color:inherit;text-decoration:none}
p{margin:0}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
::selection{background:var(--sun);color:#0f1b33}
.wrap{margin:0 auto;width:100%;max-width:1200px;padding-left:22px;padding-right:22px}
@media(min-width:640px){.wrap{padding-left:32px;padding-right:32px}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:12px;border:1px solid transparent;padding:10px 20px;font-size:.94rem;font-weight:600;cursor:pointer;transition:.15s;font-family:var(--font-plex)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--btn-navy);color:#fff}.btn-primary:hover{background:var(--btn-navy-hi)}
.btn-green{background:var(--btn-green);color:#fff}.btn-green:hover{background:var(--btn-green-hi)}
.btn-sun{background:var(--sun);color:#1b1400}.btn-sun:hover{filter:brightness(1.05)}
.btn-ghost{border-color:var(--line);background:var(--paper);color:var(--ink)}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{border-radius:9px;padding:6px 14px;font-size:.85rem}
.btn-lg{padding:14px 24px;font-size:1rem}
.btn-block{width:100%}
/* surfaces */
.card{border-radius:16px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.panel{border-radius:16px;border:1px solid var(--line-2);background:var(--tint);padding:20px}
.pad{padding:20px}.pad-lg{padding:28px}
.label{display:block;margin-bottom:6px;font-size:.84rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--paper);padding:10px 14px;font-size:.95rem;color:var(--ink);outline:none;transition:.15s;font-family:var(--font-plex)}
.input:focus{border-color:var(--navy);box-shadow:0 0 0 4px var(--navy-soft)}
textarea.input{min-height:80px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:600}
.chip-ok{background:var(--green-soft);color:var(--green)}
.chip-warn{background:var(--sun-soft);color:var(--sun-ink)}
.chip-stop{background:var(--red-soft);color:var(--red)}
.chip-info{background:var(--sky-soft);color:var(--sky)}
.chip-navy{background:var(--navy-soft);color:var(--navy)}
.chip-muted{background:var(--tint);color:var(--ink-3)}
.chip-system{background:var(--violet-soft);color:var(--violet)}
.eyebrow{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--green)}
.muted{color:var(--ink-2)}.muted-3{color:var(--ink-3)}
.small{font-size:.9rem}.tiny{font-size:.8rem}
/* layout helpers */
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.cluster{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:16px}
@media(min-width:640px){.sm-2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.lg-2{grid-template-columns:repeat(2,1fr)}.lg-3{grid-template-columns:repeat(3,1fr)}.lg-side{grid-template-columns:1.2fr .8fr}.lg-nav{grid-template-columns:230px 1fr}}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}.mt-4{margin-top:32px}
.mb-1{margin-top:0;margin-bottom:8px}.mb-2{margin-bottom:16px}
.center{text-align:center}.right{text-align:right}
.h1{font-size:clamp(1.9rem,7.2vw,3.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.h2{font-size:clamp(1.55rem,5.6vw,2.5rem);font-weight:700;line-height:1.15}
.h3{font-size:clamp(1.2rem,4.4vw,1.35rem);font-weight:700}
.lede{font-size:1.06rem;color:var(--ink-2)}
@media(min-width:640px){.lede{font-size:1.12rem}}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.95rem}
.section{padding-top:52px;padding-bottom:52px}
@media(min-width:900px){.section{padding-top:72px;padding-bottom:72px}}
.section-soft{background:radial-gradient(120% 120% at 12% -10%,var(--navy-soft) 0%,transparent 55%),radial-gradient(120% 120% at 100% 0%,var(--lilac-soft) 0%,transparent 50%),linear-gradient(180deg,var(--tint-2),var(--paper))}
.divide>*+*{border-top:1px solid var(--line-2)}
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th{border-bottom:1px solid var(--line);background:var(--tint);padding:8px 10px;text-align:left;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.table td{border-bottom:1px solid var(--line-2);padding:9px 10px;vertical-align:top}
.icon-tile{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;flex:none;font-size:1.2rem}
.icon-tile.lg{width:52px;height:52px;border-radius:14px;font-size:1.4rem}
.a-navy{background:var(--navy-soft);color:var(--navy)}.a-green{background:var(--green-soft);color:var(--green)}
.a-sun{background:var(--sun-soft);color:var(--sun-ink)}.a-violet{background:var(--violet-soft);color:var(--violet)}
.a-teal{background:var(--teal-soft);color:var(--teal)}.a-sky{background:var(--sky-soft);color:var(--sky)}
.link{color:var(--navy);font-weight:600}.link:hover{text-decoration:underline}
.hr{height:1px;background:var(--line-2);border:0;margin:20px 0}
/* header */
header.top{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px)}
.topbar{display:none;border-bottom:1px solid var(--line-2);background:var(--navy-deep);color:#fff;font-size:.8rem}
@media(min-width:640px){.topbar{display:block}}
.topbar .wrap{display:flex;align-items:center;gap:24px;height:36px}
.navrow{display:flex;align-items:center;gap:20px;height:66px}
.brandmark{width:40px;height:40px;flex:none}
.brandname{display:block;font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:-.02em;line-height:1}
.brandsub{display:block}
.brandsub{margin-top:3px;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3)}
.mainnav{display:none;align-items:center;gap:22px;margin-left:14px}
@media(min-width:900px){.mainnav{display:flex}}
.mainnav a{font-size:.9rem;font-weight:500;color:var(--ink-2)}.mainnav a:hover,.mainnav a.on{color:var(--navy)}
.navright{margin-left:auto;display:flex;align-items:center;gap:10px}
.hide-sm{display:none}@media(min-width:640px){.hide-sm{display:inline-flex}}
.menu-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer}
@media(min-width:900px){.menu-btn{display:none}}
.drawer{display:none;border-bottom:1px solid var(--line);background:var(--paper);padding:8px 20px 20px}
.drawer.open{display:block}
.drawer a{display:block;border-bottom:1px solid var(--line-2);padding:12px 0;font-weight:500}
/* footer */
footer.foot{border-top:1px solid var(--line);background:var(--tint)}
.footgrid{display:grid;gap:32px;padding:48px 0}
@media(min-width:760px){.footgrid{grid-template-columns:1.6fr 1fr 1fr 1fr}}
.footcol h5{margin:0 0 12px;font-family:var(--font-display);font-size:.9rem}
.footcol a{display:block;padding:4px 0;font-size:.9rem;color:var(--ink-2)}.footcol a:hover{color:var(--navy)}
.legalbar{border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3);padding:22px 0;line-height:1.6}
/* misc */
.badge-live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);font-weight:700;font-size:.85rem;color:var(--ink-3);background:var(--paper)}
.step.done .n{background:var(--btn-navy);border-color:var(--btn-navy);color:#fff}
.step.on .n{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 4px var(--navy-soft)}
.finding{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper)}
.finding .code{font-family:var(--font-display);font-weight:700;font-size:.8rem;flex:none;width:52px}
.bar-block{border-left:4px solid var(--red)}.bar-warn{border-left:4px solid var(--sun)}.bar-pass{border-left:4px solid var(--green)}.bar-system{border-left:4px solid var(--violet)}
.form-err{margin:0;background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-size:.9rem;font-weight:500}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:var(--navy-deep);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:.9rem;font-weight:500;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
.sticky-actions{position:sticky;bottom:0;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line-2);padding:14px 0;display:flex;gap:12px;align-items:center;margin-top:24px}
.tabbar{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabbar button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--font-plex);font-size:.92rem}
.tabbar button.on{color:var(--navy);border-bottom-color:var(--navy)}
.kpi{font-family:var(--font-display);font-weight:800;font-size:2rem;color:var(--navy);line-height:1}
.banner{background:var(--navy-deep);color:#fff;font-size:.82rem;padding:10px 0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font-family:var(--font-display);font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq .plus{display:grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;background:var(--tint);color:var(--navy);transition:.2s}
.faq details[open] .plus{transform:rotate(45deg)}
.evi{border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--tint-2)}
.evi .ph{height:70px;background:linear-gradient(135deg,var(--navy-soft),var(--sun-soft));display:grid;place-items:center;color:var(--ink-3);font-size:.7rem}
/* ===== Power Terminus brand layer — deep indigo, electric cyan, silver (from the logo) ===== */
:root{--navy:#1f1c86;--navy-hi:#2b28a8;--navy-deep:#110f4c;--navy-soft:#ecebfb;--btn-navy:#1f1c86;--btn-navy-hi:#2b28a8;
  --cyan:#0a7aa6;--cyan-bright:#55d4ff;--cyan-soft:#e3f6fd;--silver:#d9dbe6;--tint:#f3f3fb;--tint-2:#f8f8fd;--line:#dcdcee;--line-2:#ebebf6;
  --font-orb:"Orbitron",var(--font-display)}
.orb{font-family:var(--font-orb);letter-spacing:.01em}
.grad{background:linear-gradient(180deg,#7fe8ff 0%,#ffffff 52%,#6cb8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{color:var(--cyan)}
.btn-cyan{background:linear-gradient(180deg,#86ebff,#55d4ff);color:#110f4c;font-weight:700}.btn-cyan:hover{filter:brightness(1.06)}
/* header & footer: always the logo's indigo */
header.top{background:#110f4c;border-bottom:1px solid #26245a;backdrop-filter:none}
.topbar{background:#0a0933;border-bottom-color:#26245a}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brandsub{display:none;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:#b9bbd0;max-width:9rem;line-height:1.35}
@media(min-width:420px){.brandsub{display:block}}
.mainnav a{color:#d9dbe6}.mainnav a:hover,.mainnav a.on{color:#55d4ff}
header.top .menu-btn{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
header.top .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}header.top .btn-ghost:hover{border-color:#55d4ff;color:#55d4ff}
.drawer{background:#110f4c;border-bottom-color:#26245a}.drawer a{color:#fff;border-bottom-color:#26245a}
footer.foot{background:#110f4c;color:#d9dbe6;border-top:0}
.footcol h5{color:#fff}.footcol a{color:#c9cbe0}.footcol a:hover{color:#55d4ff}
.legalbar{border-top-color:#26245a;color:#b9bbd0;font-size:.72rem;padding:16px 0}.disclaimer{margin:0;max-width:110ch;line-height:1.55}.legalbar strong{color:#fff}

const r3=n=>Math.round(n*1000)/1000, nonNeg=n=>{const v=Number(n);return Number.isFinite(v)&&v>0?v:0};

/* Build validator input from a stored report + its case */
function ruleInput(rep){const cse=caseByRef(rep.caseRef);const foreign=[];DB.reports.forEach(r=>{if(r.id!==rep.id)r.evidence.forEach(e=>foreign.push({reportRef:r.ref,dhash:e.dhash}))});
  return{supply:rep.supply,appliedLoadKw:(cse&&cse.appliedLoadKw)||0,loadRows:rep.loadRows,work:rep.work,protection:rep.protection,conductors:rep.conductors,results:rep.results,instruments:DB.instruments,licences:DB.licences,anchor:cse&&cse.anchor?{lat:cse.anchor.lat,lng:cse.anchor.lng}:null,evidence:rep.evidence,foreignHashes:foreign,signatures:rep.signatures,issuedAt:rep.issuedAt}}

/* =========================================================================
   SESSION / auth (client-side demo — no real security)
   ========================================================================= */
let SESSION=(function(){try{return JSON.parse(localStorage.getItem(LS_SESSION))||null}catch(e){return null}})();
function setSession(s){SESSION=s;if(LIVE)return;try{s?localStorage.setItem(LS_SESSION,JSON.stringify(s)):localStorage.removeItem(LS_SESSION)}catch(e){}}
function signOut(){if(SESSION)logAudit("auth.sign_out","user:"+SESSION.id);setSession(null);go("#/")}
const STAFF_ROLES=["executive","supervisor","wireman","admin"];
function isStaff(){return SESSION&&STAFF_ROLES.includes(SESSION.role)}
function isCustomer(){return SESSION&&SESSION.role==="customer"}
function demoStaffCode(){const t=Math.floor(Date.now()/30000);return String((t*73939)%1000000).padStart(6,"0")}
function demoOtp(phone){return String((parseInt(String(phone).slice(-6),10)||123456)%1000000).padStart(6,"0")}

/* =========================================================================
   Tiny framework: router, render, helpers
   ========================================================================= */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function parseHash(){const raw=location.hash.replace(/^#/,"")||"/";const [path,qs]=raw.split("?");const q={};if(qs)qs.split("&").forEach(kv=>{const[k,v]=kv.split("=");q[decodeURIComponent(k)]=decodeURIComponent(v||"")});return{path,q,parts:path.split("/").filter(Boolean)}}
function opt(list,val){return list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?" selected":"")+">"+esc(l)+"</option>"}).join("")}
function iconTile(icon,accent,lg){return '<span class="icon-tile a-'+accent+(lg?" lg":"")+'">'+icon+"</span>"}
function chip(text,kind){return '<span class="chip chip-'+kind+'">'+esc(text)+"</span>"}

  // wizard
  const w=t.closest&&t.closest("[data-w]");if(w){const act=w.getAttribute("data-w");
    if(act==="pick"){WZ.svc=w.getAttribute("data-k");WZ.use=WZ.svc==="temporary"?"temporary":(WZ.use==="temporary"?"domestic":WZ.use);WZ._err=null;setTimeout(()=>{WZ.step="premises";saveWZ();renderWizard()},120);return}
    if(act==="next"){wzNext();return}
    if(act==="back"){const steps=wzSteps(),i=steps.findIndex(s=>s[0]===WZ.step);if(i>0){WZ.step=steps[i-1][0];WZ._err=null;renderWizard();window.scrollTo(0,0)}return}

  }
  // solar save
  const sa=t.closest&&t.closest("[data-s-act]");if(sa){const res=assessSolar(SOLARIN);const ref=newRef();const now=new Date().toISOString();DB.cases.unshift({ref,userId:SESSION.id,service:"solar",family:"solar",use:"domestic",applicantName:SESSION.name,phone:DB.users.find(u=>u.id===SESSION.id).phone,district:"Kamrup Metropolitan",appliedLoadKw:res.recommendedKwp,stage:1,assignedTo:"u_exec",createdAt:now,onHold:false,meta:{solar:{...SOLARIN,recommendedKwp:res.recommendedKwp,indicativeSubsidy:res.indicativeSubsidy}},consents:CONSENT_PURPOSES.filter(c=>c.required).map(p=>({purpose:p.key,givenAt:now,withdrawnAt:null})),docs:[],invoices:[],quotes:[],filing:null,events:[{stage:0,note:"Solar enquiry saved.",at:now,actor:SESSION.id},{stage:1,note:"Feasibility: "+res.recommendedKwp.toFixed(1)+" kWp recommended.",at:now,actor:"u_exec"}]});save();toast("Saved to your account");go("#/account/cases/"+ref);return}
  // account actions
  const ac=t.closest&&t.closest("[data-ac]");if(ac){const act=ac.getAttribute("data-ac"),ref=ac.getAttribute("data-ref"),c=caseByRef(ref);
    if(act==="confirmLoad"){c.meta.loadRevision.confirmedAt=new Date().toISOString();c.appliedLoadKw=c.meta.loadRevision.proposedKw;c.events.push({stage:null,note:"You confirmed the revised load: "+c.meta.loadRevision.proposedKw+" kW.",at:new Date().toISOString(),actor:SESSION.id});logAudit("case.load_confirm","case:"+ref);save();toast("Load confirmed");route();return}
    if(act==="approveQuote"){const q=c.quotes.find(x=>x.status==="shared");q.status="approved";if(c.stage<3)c.stage=3;c.events.push({stage:3,note:"You approved the quote.",at:new Date().toISOString(),actor:SESSION.id});logAudit("quote.approve","case:"+ref);save();toast("Quote approved");route();return}
    if(act==="withdraw"){const cn=c.consents.find(x=>x.purpose===ac.getAttribute("data-p"));cn.withdrawnAt=new Date().toISOString();logAudit("consent.withdraw","case:"+ref,cn.purpose);save();toast("Consent withdrawn");route();return}
    if(act==="export"){const blob=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=ref+"-my-data.json";a.click();toast("Your data downloaded");return}
  }
  // staff case actions
  const sc=t.closest&&t.closest("[data-sc]");if(sc){const act=sc.getAttribute("data-sc"),ref=sc.getAttribute("data-ref"),c=caseByRef(ref);
    if(act==="advance"){const stages=stagesFor(c.service);if(c.stage<stages.length-1){c.stage++;c.events.push({stage:c.stage,note:"Advanced to “"+stages[c.stage].t+"”.",at:new Date().toISOString(),actor:SESSION.id});logAudit("case.advance","case:"+ref,"stage "+c.stage);save();toast("Stage advanced");route()}return}
    if(act==="hold"){c.onHold=true;logAudit("case.hold","case:"+ref);save();toast("Case on hold");route();return}
    if(act==="unhold"){c.onHold=false;logAudit("case.unhold","case:"+ref);save();toast("Hold released");route();return}
    if(act==="reveal"){logAudit("pii.reveal","case:"+ref,"mobile");toast("Revealed: +91 "+c.phone+" (logged)");return}
    if(act==="newreport"){const rid="r_"+uid();DB.reports.push({id:rid,caseRef:ref,ref:"TR-"+ref.slice(4),version:1,status:"draft",supply:(c.appliedLoadKw||0)>=THRESHOLDS.threePhaseKw?"three":"single",issuedAt:null,createdBy:SESSION.id,createdAt:new Date().toISOString(),work:{commencedOn:null,completedOn:null,commencementRef:""},wiring:{system:WIRING_SYSTEMS[0],earthingType:EARTHING_TYPES[0],material:"FR PVC copper"},conductors:{mainsPhaseSqmm:null,mainsEarthSqmm:null,pointsPhaseSqmm:1.5,pointsEarthSqmm:1.5},protection:{mainsDevice:"MCB",mainsRatingA:null,dbDevice:"MCB",dbRatingA:16},remarks:"",loadRows:[["Light points",.06],["Ceiling fans",.08],["5A plug points",.1],["15A power points",1],["Geyser",2]].map(x=>({item:x[0],kwPerPoint:x[1],pointsR:0,pointsY:0,pointsB:0})),results:[],evidence:[],signatures:[],hash:null});logAudit("report.create","report:"+rid);save();go("#/staff/reports/"+rid+"?tab=work");return}
  }
  // report signing / issue
  const sg=t.closest&&t.closest("[data-sign]");if(sg){const r=reportById(sg.getAttribute("data-sign")),role=sg.getAttribute("data-role");
    if(role==="__issue"){const b=blockers(validateReport(ruleInput(r)));if(b.length){toast(b.length+" blocker(s) remain");return}if(signatureGaps(r.signatures).length){toast("Signatures incomplete");return}r.status="issued";r.issuedAt=new Date().toISOString();r.hash=hexHash(r.ref.length+r.loadRows.length+7);const c=caseByRef(r.caseRef);if(c&&c.stage<3)c.stage=3;logAudit("report.issue","report:"+r.id);save();toast("Report issued");route();return}
    const cse=caseByRef(r.caseRef);const names={wireman:"M. Ali",supervisor:"P. Kalita",firm:"R. Das",consumer:cse?cse.applicantName:"Consumer"};const permits={wireman:"ELB/AS/WM/2022/5512",supervisor:"ELB/AS/SUP/2020/7741",firm:"ELB/AS/CON/2019/1184",consumer:null};
    if(r.signatures.some(s=>s.role===role)){toast("Already signed");return}
    r.signatures.push({role,name:names[role],permitNo:permits[role],sessionId:"sess-"+SESSION.id+"-"+role,signedAt:new Date().toISOString()});logAudit("report.sign","report:"+r.id,role);save();toast(role+" signed");route();return}
  // copy buttons (filing)
  const cp=t.closest&&t.closest("[data-copy]");if(cp){navigator.clipboard&&navigator.clipboard.writeText(cp.getAttribute("data-copy"));toast("Copied");return}
  const fs=t.closest&&t.closest("[data-fil-save]");if(fs){const c=caseByRef(fs.getAttribute("data-fil-save"));const no=document.getElementById("apdclNo").value.trim();if(!c.filing)c.filing={mode:"B",checklist:{}};c.apdclApplicationNo=no||c.apdclApplicationNo;c.events.push({stage:c.stage,note:"Filing recorded"+(no?" (APDCL "+no+")":"")+".",at:new Date().toISOString(),actor:SESSION.id});logAudit("filing.record","case:"+c.ref,no);save();toast("Filing recorded");route();return}
}
function onInput(e){
  const t=e.target;
  if(t.matches&&t.matches("[data-other-toggle]")){const w=t.form&&t.form.querySelector("[data-other-wrap]");if(w){w.hidden=t.value!==OTHER_NEED;if(!w.hidden)w.querySelector("input").focus()}return}
  const w=t.closest&&t.closest("[data-w]");if(w){const act=w.getAttribute("data-w");
    if(act==="f"){WZ[w.getAttribute("data-f")]=t.value;if(w.getAttribute("data-f")==="district"){renderWizard()}saveWZ();return}
    if(act==="appl"){WZ.appliances[+w.getAttribute("data-i")]=Math.max(0,Math.min(99,parseInt(t.value,10)||0));saveWZ();const est=document.querySelector(".kpi");renderWizard();return}
    if(act==="doc"){WZ.docsHave[w.getAttribute("data-slot")]=t.checked;saveWZ();renderWizard();return}
    if(act==="consent"){const k=w.getAttribute("data-k");if(t.checked){if(!WZ.consents.includes(k))WZ.consents.push(k)}else WZ.consents=WZ.consents.filter(x=>x!==k);saveWZ();return}
  }
  // solar
  const s=t.getAttribute&&t.getAttribute("data-s");if(s){SOLARIN[s]=parseFloat(t.value)||0;renderSolar();return}
  // report editor
  const r=t.getAttribute&&t.getAttribute("data-r");if(r){const rep=reportById(t.getAttribute("data-id"));let v=t.value;if(t.getAttribute("data-num"))v=v===""?null:parseFloat(v);if(r==="supply"){rep.supply=v;save();route();return}setPath(rep,r,v);save();refreshFindings();return}
  const rl=t.getAttribute&&t.getAttribute("data-rl");if(rl){const rep=reportById(rl);rep.loadRows[+t.getAttribute("data-row")][t.getAttribute("data-col")]=Math.max(0,parseInt(t.value,10)||0);save();refreshFindings();
    const cell=t.closest("tr").lastElementChild;if(cell)cell.textContent=rowTotals(rep.loadRows[+t.getAttribute("data-row")]).kw.toFixed(2);return}
  const rs=t.getAttribute&&t.getAttribute("data-res");if(rs){const rep=reportById(rs),code=t.getAttribute("data-code"),field=t.getAttribute("data-field");let res=rep.results.find(x=>x.code===code);if(!res){res={code,value:"",instrumentId:null};rep.results.push(res)}let v=t.value;if(t.getAttribute("data-num"))v=v===""?null:parseInt(v,10);res[field]=v;save();refreshFindings();return}
  const fil=t.getAttribute&&t.getAttribute("data-fil");if(fil){const c=caseByRef(fil);if(!c.filing)c.filing={mode:"B",checklist:{}};c.filing.checklist[t.getAttribute("data-k")]=t.checked;save();return}
}
function onSubmit(e){
  const f=e.target;
  if(f.id==="trackForm"){e.preventDefault();go("#/track?ref="+encodeURIComponent(f.ref.value.trim()));return}
  if(f.id==="verifyForm"){e.preventDefault();go("#/verify?ref="+encodeURIComponent(f.ref.value.trim()));return}
  if(f.id==="requestForm"){e.preventDefault();const key=f.getAttribute("data-svc"),cfg=REQUEST_FORMS[key],d=Object.fromEntries(new FormData(f));const er=leadErrors(d,{consumer:cfg.consumer});if(er.length){formErr(f,"We still need "+er.join(", ")+".");return}const ref=createLeadCase(key,d,{request:{type:d.workType===OTHER_NEED?"Other: "+d.otherNeed.trim():d.workType,premises:d.premises,description:(d.description||"").trim()}},cfg.eventNote+": "+(d.workType===OTHER_NEED?d.otherNeed.trim():d.workType)+".");toast("Request received — we'll call you");go(afterSubmit(ref));return}
  if(f.id==="enquiryForm"){e.preventDefault();const d=Object.fromEntries(new FormData(f));const er=leadErrors(d,{msg:true});if(er.length){formErr(f,"We still need "+er.join(", ")+".");return}const ref=createLeadCase("other",d,{request:{description:d.message.trim()}},"Enquiry received: "+d.message.trim().slice(0,120));toast("Thanks — we'll call you back");go(afterSubmit(ref));return}
  if(f.id==="solarLeadForm"){e.preventDefault();const d=Object.fromEntries(new FormData(f));const er=leadErrors(d,{consumer:"required",subdiv:true});if(er.length){formErr(f,"We still need "+er.join(", ")+".");return}const res=assessSolar(SOLARIN);const ref=createLeadCase("solar",d,{solar:{...SOLARIN,recommendedKwp:res.recommendedKwp,indicativeSubsidy:res.indicativeSubsidy}},"Solar enquiry: about "+res.recommendedKwp.toFixed(1)+" kWp indicated by the feasibility check.");toast("Request received — we'll call you");go(afterSubmit(ref));return}
  if(f.id==="noteForm"){e.preventDefault();const c=caseByRef(f.getAttribute("data-ref"));const note=f.note.value.trim();if(note){c.events.push({stage:c.stage,note,at:new Date().toISOString(),actor:SESSION.id});logAudit("case.note","case:"+c.ref);save();route()}return}
  if(f.id==="loginForm"){e.preventDefault();const phone=normPhone(f.phone.value);const next=f.getAttribute("data-next");const area=document.getElementById("otpArea"),btn=document.getElementById("loginBtn");
    if(btn.getAttribute("data-sent")!=="1"){if(!validMobile(phone)){toast("Enter a valid 10-digit mobile");return}const code=demoOtp(phone);area.innerHTML='<div style="background:var(--sun-soft);color:var(--sun-ink);padding:10px;border-radius:10px;font-size:.85rem" class="mt-1"><b>Demo — no SMS is sent.</b> Your code is <b style="letter-spacing:.2em">'+code+'</b></div><div class="mt-1"><label class="label">6-digit sign-in code</label><input class="input" name="code" inputmode="numeric" maxlength="6" value="'+code+'" style="text-align:center;letter-spacing:.3em"></div>';btn.textContent="Verify & sign in";btn.setAttribute("data-sent","1");return}
    const code=f.code?f.code.value:"";if(code!==demoOtp(phone)){toast("Code does not match");return}let u=DB.users.find(x=>x.role==="customer"&&normPhone(x.phone)===phone);if(!u){u={id:"c_"+uid(),name:"New customer",role:"customer",phone};DB.users.push(u);save()}setSession({id:u.id,name:u.name,role:"customer"});logAudit("auth.sign_in","user:"+u.id,"customer code");toast("Signed in");go("#"+(next||"/account"));return}
  if(f.id==="staffLoginForm"){e.preventDefault();const email=f.email.value,pass=f.password.value,code=f.code.value;const u=DB.users.find(x=>x.email===email);if(!u||pass!=="setu-demo-2026"){toast("Email or password incorrect");return}if(code!==demoStaffCode()){toast("Authenticator code incorrect (see the demo code shown)");return}setSession({id:u.id,name:u.name,role:u.role});logAudit("auth.sign_in","user:"+u.id,"staff");toast("Signed in");go("#"+(f.getAttribute("data-next")||"/staff"));return}
}


/* =========================================================================
   Router
   ========================================================================= */
function afterSubmit(ref){return LIVE?"#/thanks?ref="+encodeURIComponent(ref):"#/track?ref="+encodeURIComponent(ref)}
function viewThanks(q){return page(null,'<section class="section"><div class="wrap center" style="max-width:620px"><span class="usp-dot" style="margin:0 auto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span><h1 class="h2 mt-3">Thank you — we\'ve got your request</h1><p class="lede mt-1">Your reference is <b class="orb" style="color:var(--navy)">'+esc(q.ref||"")+'</b>. Our team will call you within one working day.</p><div class="cluster mt-3" style="justify-content:center"><a href="#/" class="btn btn-primary">Back to home</a><a href="'+BRAND.whatsapp+'" target="_blank" rel="noopener" class="btn btn-green">WhatsApp us</a><a href="tel:'+BRAND.phoneE164+'" class="btn btn-ghost">Call '+esc(BRAND.phoneDisplay)+'</a></div><p class="small muted mt-2">Or email <a class="link" href="mailto:'+BRAND.email+'">'+esc(BRAND.email)+'</a></p></div></section>')}
function route(){
  window.scrollTo(0,0);
  const {path,q,parts}=parseHash();
  if(LIVE&&/^\/(track|verify|login|account|staff)/.test(path)){location.replace("#/");return}
  let html="";
  try{
    if(path==="/"||path==="")html=viewHome();
    else if(path==="/services")html=viewServices();
    else if(path==="/apply")html=viewApply(q);
    else if(path==="/solar")html=viewSolar();
    else if(path==="/wiring")html=viewWiring(q);
    else if(path==="/thanks")html=viewThanks(q);
    else if(path==="/request")html=viewRequest(q.s,q);
    else if(path==="/track")html=viewTrack(q);
    else if(path==="/verify")html=viewVerify(q);
    else if(path==="/login")html=viewLogin(q);
    else if(path==="/privacy")html=viewPrivacy();
    else if(path==="/terms")html=viewTerms();
    else if(parts[0]==="account"&&parts[1]==="cases"&&parts[2])html=viewAccountCase(parts[2]);
    else if(path==="/account")html=viewAccount();
    else if(path==="/staff/login")html=viewStaffLogin(q);
    else if(parts[0]==="staff"){ if(!isStaff()){html=viewStaffLogin({next:path});}
      else if(path==="/staff")html=viewStaffDash();
      else if(parts[1]==="cases"&&parts[2])html=viewStaffCase(parts[2]);
      else if(parts[1]==="cases")html=viewStaffCases(q);
      else if(parts[1]==="reports"&&parts[2])html=viewStaffReport(parts[2],q);
      else if(parts[1]==="reports")html=viewStaffReports();
      else if(parts[1]==="filing"&&parts[2])html=viewStaffFiling(parts[2]);
      else if(parts[1]==="filing")html=viewStaffFilingList();
      else if(parts[1]==="team")html=viewStaffTeam();
      else if(parts[1]==="masters")html=viewStaffMasters();
      else if(parts[1]==="audit")html=viewStaffAudit();
      else if(parts[1]==="integrations")html=viewStaffIntegrations();
      else html=notFound();
    }
    else html=notFound();
  }catch(err){html=page(null,'<div class="wrap section"><h1 class="h2">Something went wrong</h1><p class="muted mt-1">'+esc(err&&err.message)+'</p><pre class="small" style="white-space:pre-wrap;color:var(--ink-3)">'+esc(err&&err.stack||"")+'</pre></div>');}
  document.getElementById("app").innerHTML=html;
  if(typeof afterRender==="function")afterRender(path,q);
}
function notFound(){return page(null,'<div class="wrap section center"><p class="eyebrow">404</p><h1 class="h2 mt-1">Page not found</h1><p class="muted mt-1">The page you asked for is not here.</p><a href="#/" class="btn btn-primary mt-3">Back to home</a></div>')}

/* =========================================================================
   Global event handling + init
   ========================================================================= */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem(LS_THEME,t)}catch(e){}}
try{localStorage.removeItem(LS_THEME)}catch(e){}  // single light theme

document.addEventListener("click",function(e){
  const a=e.target.closest("[data-act]");
  if(a){const act=a.getAttribute("data-act");
    if(act==="theme"){applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");return}
    if(act==="menu"){const d=document.getElementById("drawer");if(d)d.classList.toggle("open");return}
    if(act==="signout"){e.preventDefault();signOut();return}
    if(act==="reset"){e.preventDefault();resetDemo();return}
  }
  const c=e.target.closest("[data-close]");if(c){const d=document.getElementById("drawer");if(d)d.classList.remove("open");}
  if(typeof onClick==="function")onClick(e);
});
document.addEventListener("input",function(e){if(typeof onInput==="function")onInput(e)});
document.addEventListener("submit",function(e){if(typeof onSubmit==="function")onSubmit(e)});
window.addEventListener("hashchange",route);
route();

</script>
